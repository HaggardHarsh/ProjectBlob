skill:
  name: "Weather Fetcher"
  version: "1.0.0"
  description: "Get current weather conditions and forecast for any location"
  author: "BlobBuiltins"
  color: "#4FC3F7"
  icon: "cloud-sun"

  permissions:
    - network.http    # Needs HTTP access to wttr.in

  triggers:
    - "weather"
    - "what's the weather"
    - "is it going to rain"
    - "temperature"
    - "forecast"

  tools:
    - name: "current_weather"
      description: "Get current weather for a location"
      command: "curl -s 'https://wttr.in/{location}?format=3'"
      args:
        - name: "location"
          description: "City name or coordinates"
          required: false
          default: ""  # Auto-detect by IP

    - name: "detailed_forecast"
      description: "Get detailed weather forecast"
      command: "curl -s 'https://wttr.in/{location}?format=j1'"
      args:
        - name: "location"
          description: "City name or coordinates"
          required: false
          default: ""

  response_template: |
    Here's the weather for {location}:
    {result}
    
  emote_on_success: "HAPPY"
  emote_on_failure: "CONFUSED"
