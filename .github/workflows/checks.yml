name: Release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            lock: requirements/linux-py312.lock
          - python: "3.14"
            lock: requirements/linux-py314.lock
    timeout-minutes: 25
    env:
      NEBIUS_API_KEY: synthetic-ci-key
      BLOB_AGENT_RUNTIME: classic
      ANONYMIZED_TELEMETRY: "False"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Allow sandboxed Playwright Chromium on this runner
        run: |
          sudo install -o root -g root -m 0644 deploy/ci/apparmor-playwright /etc/apparmor.d/blob-ci-playwright
          sudo apparmor_parser -r /etc/apparmor.d/blob-ci-playwright
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.lock }}
      - name: Install locked dependencies and Blob
        run: |
          python -m pip install -r '${{ matrix.lock }}'
          python -m pip install --no-build-isolation --no-deps -e 'backend_python[dev,web,vision]'
          python -m pip check
          python tools/lock_dependencies.py --check
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Backend regression tests
        run: |
          timeout --signal=INT --kill-after=30s 10m \
            python -m pytest backend_python/tests -vv -o faulthandler_timeout=90 --junitxml=backend-tests.xml
      - name: Build source distribution and wheel
        run: python -m build --no-isolation --outdir dist backend_python
      - name: Check installed wheel outside checkout
        run: |
          python -m pip uninstall -y blob-backend
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tools/release_smoke.py" --source-root "$GITHUB_WORKSPACE"
          blob-backend --help
          blob-chat --help
      - name: Save test report and backend packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-release-checks-${{ matrix.python }}
          path: |
            backend-tests.xml
            dist/*
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libsdl2-dev libgrpc++-dev protobuf-compiler protobuf-compiler-grpc libprotobuf-dev libx11-dev
      - name: Build and test overlay
        run: |
          cmake -S frontend_cpp -B frontend_cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build frontend_cpp/build --parallel 2
          ctest --test-dir frontend_cpp/build --output-on-failure

  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Allow sandboxed Playwright Chromium on this runner
        run: |
          sudo install -o root -g root -m 0644 deploy/ci/apparmor-playwright /etc/apparmor.d/blob-ci-playwright
          sudo apparmor_parser -r /etc/apparmor.d/blob-ci-playwright
      - name: Exercise stock Ubuntu Python and native package setup
        run: /usr/bin/python3 tools/setup.py --prepare-only --install-system-deps
      - name: Verify installed candidate and virtual X11 desktop
        run: |
          sudo apt-get install -y xvfb xauth desktop-file-utils
          /usr/bin/python3 tools/validate_ubuntu_candidate.py
      - name: Save clean installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-installer-checks
          path: |
            .runtime/desktop/releases/*/installation.json
            .runtime/desktop/releases/*/validation.json
            .runtime/desktop/releases/*/backend-tests.xml
            .runtime/desktop/releases/*/x11-preview.png
          include-hidden-files: true
