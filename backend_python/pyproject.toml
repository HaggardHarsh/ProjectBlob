[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blob-backend"
version = "0.1.0"
description = "Project Blob AI Backend"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.59.0",
    "grpcio-tools>=1.59.0",
    "chromadb>=0.4.15",
    "openai>=1.3.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0",
    "pillow>=10.0.1",
    "pypdfium2>=4.30,<6",
    "dbus-next>=0.2.3; sys_platform == 'linux'",
    "psutil>=5.9.6",
    "pydantic>=2.4.2",
    "watchdog>=3.0.0"
]

[project.optional-dependencies]
ocr = ["easyocr>=1.7.1"]
vision = ["opencv-contrib-python>=4.8,<5"]
web = ["aiohttp>=3.12,<4", "ddgs>=9,<10", "playwright>=1.49,<2"]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0"]

[project.scripts]
blob-backend = "blob.main:main"
blob-chat = "blob.client:main"
blob-desktop = "blob.desktop:main"
blob-agent = "blob.agents.cli:main"

[tool.setuptools.packages.find]
include = ["blob*"]
exclude = ["data*", "tests*"]

[tool.setuptools.package-data]
blob = ["../data/*.yaml"]
